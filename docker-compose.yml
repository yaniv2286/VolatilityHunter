services:
  volatilityhunter:
    build:
      context: .
      dockerfile: Dockerfile
    image: volatilityhunter:latest
    container_name: volatilityhunter
    restart: always
    env_file:
      - .env
    environment:
      # US-market-relative schedule used by cron inside the container.
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # IBKR TWS / IB Gateway endpoint.  The Gateway must be reachable from
      # the container.  If IB Gateway runs directly on the VPS host, the
      # extra_hosts alias below resolves host.docker.internal to the host.
      - IBKR_HOST=host.docker.internal
      - IBKR_PORT=7497
      - IBKR_CLIENT_ID=42
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./.env:/app/.env:ro
    networks:
      - family-agents-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pgrep cron || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  family-agents-net:
    external: true
    name: family-agents-net
